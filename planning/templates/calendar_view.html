{% extends 'base/base.html' %}
{% load static %}

{% block page_title %}
Planning - Calendrier
{% endblock %}

{% block extra_css %}
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
<link rel="stylesheet" href="{% static 'css/calendar_view.css' %}">
{% endblock %}

{% block content %}
<div class="calendar-container">
    <div id="calendar"></div>
</div>
{% endblock %}

{% block extra_js %}
{{ tasks|json_script:"calendar-data" }}

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const calendarEl = document.getElementById('calendar');
        const calendarDataElement = document.getElementById('calendar-data');

        if (!calendarEl || !calendarDataElement) return;

        let events = [];
        try {
            events = JSON.parse(calendarDataElement.textContent);
        } catch (e) {
            console.error("Error parsing calendar data", e);
        }

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'fr',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay,listMonth'
            },
            buttonText: {
                today: "Aujourd'hui",
                month: 'Mois',
                week: 'Semaine',
                day: 'Jour',
                list: 'Liste'
            },
            themeSystem: 'standard',
            events: events,
            editable: true, // Allow dragging if needed (backend update required)
            selectable: true,
            dayMaxEvents: true, // Allow "more" link when too many events
            eventClick: function (info) {
                console.log("Event clicked:", info.event);
                // Example: Alert or Modal
                const props = info.event.extendedProps;
                alert(`Travaux: ${info.event.title}\nStatut: ${props.status || 'N/A'}`);
            },
            dateClick: function (info) {
                console.log("Date clicked:", info.dateStr);
            }
        });

        calendar.render();
    });
</script>
{% endblock %}
